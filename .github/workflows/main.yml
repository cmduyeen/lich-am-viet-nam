name: Update Lunar Calendar ICS

on:
  push:
    branches:
      - main
    paths:
      - 'main.py'
      - 'src/**'
      - 'requirements.txt'
      - 'tests/**'
      - '.github/workflows/main.yml'
  schedule:
    - cron: '17 0 1 * *'  # 07:17 giờ Việt Nam, ngày 1 hằng tháng
  workflow_dispatch:      # Cho phép chạy thủ công từ tab Actions bất kỳ lúc nào

concurrency:
  group: lunar-calendar-update
  cancel-in-progress: false

jobs:
  update-calendar:
    runs-on: ubuntu-24.04
    timeout-minutes: 10   # Giới hạn thời gian tối đa để bảo vệ tài nguyên
    permissions:
      contents: write    # Cho phép action push code ngược lại repo

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: python -m pip install -r requirements.txt

      - name: Test calendar compatibility
        run: python -m unittest discover -s tests -v

      - name: Generate Calendar files
        run: |
          # Tự động tạo file tổng hợp 10 năm cuốn chiếu và các file riêng từng năm
          python main.py --split
          python main.py --language en --split

      - name: Record successful refresh
        run: python -m src.publication --record

      - name: Commit and push changes
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          python -m src.publication --stage
          if ! git diff --cached --quiet; then
            git commit -m "chore: refresh bilingual lunar calendars (10-year rolling)"
            git config --local http.https://github.com/.extraheader "AUTHORIZATION: basic $(printf 'x-access-token:%s' "$GH_TOKEN" | base64 -w0)"
            git push
          fi
