name: Update Lunar Calendar ICS

on:
  push:
    branches:
      - main
    paths:
      - 'main.py'
      - 'src/**'
      - 'requirements.txt'
      - '.github/workflows/main.yml'
  schedule:
    - cron: '0 0 1 1 *'  # Chạy 1 năm 1 lần vào 00:00 ngày 1 tháng 1 hàng năm
  workflow_dispatch:      # Cho phép chạy thủ công từ tab Actions bất kỳ lúc nào

jobs:
  update-calendar:
    runs-on: ubuntu-latest
    timeout-minutes: 10   # Giới hạn thời gian tối đa để bảo vệ tài nguyên
    permissions:
      contents: write    # Cho phép action push code ngược lại repo

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: python -m pip install -r requirements.txt

      - name: Generate Calendar files
        run: |
          # Tự động tạo file tổng hợp 10 năm cuốn chiếu và các file riêng từng năm
          python main.py --split

      - name: Commit and push changes
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          git add -A output/
          if ! git diff --cached --quiet; then
            git commit -m "chore: annual auto-update lunar calendar files (10-year rolling)"
            git config --local http.https://github.com/.extraheader "AUTHORIZATION: basic $(printf 'x-access-token:%s' "$GH_TOKEN" | base64 -w0)"
            git push
          fi
