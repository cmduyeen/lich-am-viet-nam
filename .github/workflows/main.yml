name: Update Lunar Calendar ICS

on:
  push:
    branches:
      - main
  schedule:
    - cron: '0 0 1 1 *'  # Chạy 1 năm 1 lần vào 00:00 ngày 1 tháng 1 hàng năm
  workflow_dispatch:      # Cho phép chạy thủ công từ tab Actions bất kỳ lúc nào

jobs:
  update-calendar:
    runs-on: ubuntu-latest
    timeout-minutes: 10   # Giới hạn thời gian tối đa để bảo vệ tài nguyên
    permissions:
      contents: write    # Cho phép action push code ngược lại repo

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Test calendar generation
        run: python -m unittest discover -s tests -v

      - name: Generate full and minimal lunar calendar files
        run: |
          # Tự động tạo file tổng hợp 10 năm cuốn chiếu và các file riêng từng năm
          python main.py --split
          python main.py --language en --split
          python main.py --minimal --split
          python main.py --language en --minimal --split

      - name: Commit and push changes
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          git add -A output/
          git diff --quiet && git diff --staged --quiet || (git commit -m "chore: annual auto-update lunar calendar files (10-year rolling) [skip ci]" && git push)
